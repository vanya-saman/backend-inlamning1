<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<style>
    body {
        font-size: 18px;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: antiquewhite;
    }

    .container {
        width: 800px;
        max-width: 98vw;
        padding: 25px;
        background-color: rgb(177 92 34 / 0.65);
        border: 1px solid black;
        border-radius: 20px;
    }
    table{
        width: 100%;
    }
    th{
        text-align: left;
    }
</style>
<body>
<span><a href="/home">Home</a> <a href="/genre">Search by genre</a></span>
<h1>Recommended Books</h1>
<div class="container">
    <table>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th style="text-align: right">Genre</th>
        </tr>
        <tr th:each="book: ${books}">
            <td style="text-align: left" th:text="${book.title}">Title</td>
            <td style="text-align: left" th:text="${book.author}">Author</td>
            <td style="text-align: right" th:text="${book.genre}">Genre</td>
        </tr>
    </table>
</div>

</body>
</html>
