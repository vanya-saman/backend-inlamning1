<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<style>
    body {
        font-size: 25px;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: antiquewhite;
    }

    .container {
        width: 800px;
        max-width: 98vw;
        padding: 25px;
        background-color: rgb(177 92 34 / 0.65);
        border: 1px solid black;
        border-radius: 20px;
    }
</style>
<body>
<span><a href="/home">Home</a> <a href="/genre">Search by genre</a></span>
<h1>Recommended Books</h1>
<div class="container">
    <ul>
        <li th:each="book : ${books}">
            <span th:text="${book.title} + ', '">Title</span>
            <span style="font-weight: bold" th:text="${book.author} + ', '">Author</span>
            <span style="font-style: italic" th:text="${book.genre}">Genre</span>
        </li>
    </ul>
</div>

</body>
</html>
