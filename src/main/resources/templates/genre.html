<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<style>
    body {
        font-size: 25px;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: antiquewhite;
    }

    .container {
        margin-top: 20px;
        width: 700px;
        min-width: fit-content;
        max-width: 100vw;
        padding: 25px;
        background-color: rgb(177 92 34 / 0.65);
        border: 1px solid black;
        border-radius: 20px;
    }

    table{
        width: 100%;
    }
    p{
        margin: 0;
    }
    input, select {
        font-size: 25px;
    }
</style>
<body>
<span><a href="/home">Home</a> <a href="/books">Recommended books</a></span>

<h1>Get book by genre</h1>
<form action="/genre" method="GET">
    <label>
        <select name="type">
            <option value="">Any</option>
            <option>Fantasy</option>
            <option>Comedy</option>
            <option>History</option>
            <option>Mystery</option>
            <option>Adventure</option>
        </select>
    </label>
    <input type="submit" value="Submit">
</form>

<div class="container">
    <p th:text="${message}"></p>
    <hr>
    <table>
        <tr>
            <th style="text-align: left" >Title</th>
            <th style="text-align: right">Author</th>
        </tr>
        <tr th:each="book: ${books}">
            <td style="text-align: left" th:text="${book.title}">Title</td>
            <td style="text-align: right" th:text="${book.author}">Authro</td>
        </tr>
    </table>
</div>

</body>
</html>
