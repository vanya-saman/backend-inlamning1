<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<style>
    body {
        font-size: 25px;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: antiquewhite;
    }

    .container {
        margin-top: 20px;
        width: 700px;
        min-width: fit-content;
        max-width: 100vw;
        padding: 25px;
        background-color: rgb(177 92 34 / 0.65);
        border: 1px solid black;
        border-radius: 20px;
    }

    .books{
        display: flex;
        flex-direction: row;
        justify-content: space-between;
    }
    p{
        margin: 0;
    }
    input, select {
        font-size: 25px;
    }
</style>
<body>
<span><a href="/home">Home</a> <a href="/books">Recommended books</a></span>

<h1>Get book by genre</h1>
<form action="/genre" method="GET">
    <label>
        <select name="type">
            <option value="">Any</option>
            <option>Fantasy</option>
            <option>Comedy</option>
            <option>History</option>
            <option>Mystery</option>
            <option>Adventure</option>
        </select>
    </label>
    <input type="submit" value="Submit">
</form>

<div class="container">
    <p th:text="${message}"></p>
    <hr>
    <div class="books" th:each="book : ${books}">
        <span th:text="${book.title}"></span>
        <span style="font-style: italic" th:text="${book.author}"></span>
    </div>
</div>

</body>
</html>
